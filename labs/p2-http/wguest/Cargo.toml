[package]
name = "wguest"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.62.0", features = ["async"] }

# Explicitly P2: the `wasip2` crate pins WASIp2 (WASI 0.2.x) bindings.
# (The `wasi` crate is only a re-export of the latest stable WASI proposal.)
wasip2 = "2"