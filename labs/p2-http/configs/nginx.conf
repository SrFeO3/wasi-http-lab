worker_processes  1;
events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            content_by_lua_block {
                local uri = ngx.var.uri

                -- 1. Handle /sleep/N: Sleep for N seconds
                local sleep_time = string.match(uri, "^/sleep/(%d+)$")
                if sleep_time then
                    ngx.sleep(tonumber(sleep_time))
                end

                -- 2. Handle /error/NNN: Exit with status NNN
                local error_code = string.match(uri, "^/error/(%d+)$")
                if error_code then
                    ngx.status = tonumber(error_code)
                    ngx.say("Error: " .. error_code)
                    ngx.exit(ngx.status)
                end

                -- 3. Default: Echo Request/Response info
                ngx.header.content_type = "text/plain"
                ngx.header["X-Custom-Header"] = "Hello-OpenResty" -- Test response header

                ngx.say("--- Request Info ---")
                ngx.say("Host: ", ngx.var.host)
                ngx.say("Path: ", uri)
                
                ngx.say("\n--- Request Headers ---")
                local h = ngx.req.get_headers()
                for k, v in pairs(h) do
                    ngx.say(k, ": ", v)
                end

                ngx.say("\n--- Response Headers ---")
                local rh = ngx.resp.get_headers()
                for k, v in pairs(rh) do
                    ngx.say(k, ": ", v)
                end

                if sleep_time then
                    ngx.say("\n(Note: Slept for ", sleep_time, " seconds)")
                end
            }
        }
    }
}
